<header class="app-header" [ngClass]="sidebarWidth">
  <!-- =======================================================
       LEFT
  ======================================================== -->
  <div class="app-header__left">
    <!-- MOBILE / TABLET ONLY -->
    <button *ngIf="!layoutMode" type="button" class="app-header__mobile-menu-btn" (click)="_doToggleMobileMenu()"
      aria-label="Open navigation">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 6H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path d="M4 12H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path d="M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <span class="app-header__page-name">
      Page Name
    </span>
  </div>
  <!-- =======================================================
       RIGHT
  ======================================================== -->
  <div class="app-header__right">
    <i class="fa-solid fa-circle-user"></i>
    <span class="app-header__user-name">
      User In
    </span>
    <div class="dropdown app-header__right--actdpd custom-dropdown">
      <button type="button" class="dropdown-toggle-btn" data-bs-toggle="dropdown">
        <i class="fa-solid fa-caret-down"></i>
      </button>
      <ul class="dropdown-menu custom-dropdown-menu">
        <li class="dropdown-item custom-item">
          <i class="fa-solid fa-key"></i>
          <span>
            Change Password
          </span>
        </li>
        <li class="dropdown-item custom-item" (click)="_doLogout()">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>
            Logout
          </span>
        </li>
        <li class="dropdown-item custom-item">
          <div class="form-check form-switch custom-switch">
            <input class="form-check-input" type="checkbox" id="layoutSwitch" [(ngModel)]="layoutMode"
              (change)="_doToggleLayout($event)">
            <label class="form-check-label" for="layoutSwitch">
              Toggle Layout
            </label>
          </div>
        </li>
      </ul>
    </div>
  </div>
</header>
