<header class="app-header" [ngClass]="sidebarWidth">

  <div class="app-header__left">
    <span>Page Name</span>
  </div>

  <div class="app-header__right">

    <i class="fa-solid fa-circle-user"></i>
    <span>User In</span>


    <div class="dropdown app-header__right--actdpd custom-dropdown">
      <button class="dropdown-toggle-btn" data-bs-toggle="dropdown">
        <i class="fa-solid fa-caret-down"></i>
      </button>

      <ul class="dropdown-menu custom-dropdown-menu">

        <li class="dropdown-item custom-item">
          <i class="fa-solid fa-key"></i> Change Password
        </li>

        <li class="dropdown-item custom-item" (click)="_doLogout()">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </li>

        <li class="dropdown-item custom-item">
          <div class="form-check form-switch custom-switch">
            <input class="form-check-input" type="checkbox" id="layoutSwitch" [(ngModel)]="layoutMode" (change)="_doToggleLayout($event)">
            <label class="form-check-label" for="layoutSwitch">Toggle Layout</label>
          </div>
        </li>

      </ul>
    </div>

  </div>
</header>
