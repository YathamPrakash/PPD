<div class="dashboard">


  <!-- =====================================================
       PAGE HEADER
       ===================================================== -->

  <app-page-header [title]="pageTitle" [description]="pageDescription">

    <div class="dashboard__header-actions">


      <!-- Add Room -->

      <button type="button" class="dashboard__secondary-button" (click)="onAddRoom()">

        <i class="fa-solid fa-plus" aria-hidden="true">
        </i>

        <span>
          Add Room
        </span>

      </button>


      <!-- Add Tenant -->

      <button type="button" class="dashboard__primary-button" (click)="onAddTenant()">

        <i class="fa-solid fa-plus" aria-hidden="true">
        </i>

        <span>
          Add Tenant
        </span>

      </button>

    </div>

  </app-page-header>


  <!-- =====================================================
       STATISTICS
       ===================================================== -->

  <section class="dashboard__stats" aria-label="Property statistics">

    @for (
    stat of statistics;
    track stat.label
    ) {

    <app-stat-card [label]="stat.label" [value]="stat.value" [description]="stat.description" [icon]="stat.icon"
      [variant]="stat.variant">

    </app-stat-card>

    }

  </section>


  <!-- =====================================================
       ANALYTICS
       ===================================================== -->

  <section class="dashboard__analytics" aria-label="Property analytics">


    <!-- ===================================================
         REVENUE
         =================================================== -->

    <app-chart-card class="dashboard__revenue-chart" title="Revenue Overview"
      description="Track your property revenue over time" chartType="line" [actions]="revenueActions"
      [selectedAction]="revenuePeriod" [showMenu]="true" footer="Revenue data is updated daily" (actionChange)="
        onRevenuePeriodChange($event)
      " (menuAction)="
        onRevenueMenuAction($event)
      ">


      <canvas #revenueChart aria-label="Revenue trend chart">
      </canvas>


    </app-chart-card>


    <!-- ===================================================
         OCCUPANCY
         =================================================== -->

    <app-chart-card class="dashboard__occupancy-chart" title="Occupancy Overview"
      description="Room occupancy for the selected period" chartType="bar" [actions]="occupancyActions"
      [selectedAction]="occupancyPeriod" [showMenu]="true" footer="18 of 24 rooms are currently occupied"
      (actionChange)="
        onOccupancyPeriodChange($event)
      " (menuAction)="
        onOccupancyMenuAction($event)
      ">


      <canvas #occupancyChart aria-label="Room occupancy chart">
      </canvas>


    </app-chart-card>

  </section>


  <!-- =====================================================
       RECENT ACTIVITY
       ===================================================== -->

  <section class="dashboard__activity">


    <div class="dashboard__section-header">

      <div>

        <h2>
          Recent Activity
        </h2>

        <p>
          Latest updates across your property
        </p>

      </div>


      <button type="button" class="dashboard__view-all" (click)="onViewAllActivity()">

        View all

      </button>

    </div>


    <div class="dashboard__activity-card">

      <app-timeline [items]="recentActivities" [showLine]="true" [clickable]="true" (itemClick)="
          onActivityClick($event)
        ">

      </app-timeline>

    </div>

  </section>

</div>
