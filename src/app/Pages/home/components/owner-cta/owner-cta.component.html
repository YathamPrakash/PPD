<section class="owner-cta">
    <div class="owner-cta__container">
        <!-- ============================================
             CONTENT
        ============================================= -->
        <div class="owner-cta__content">
            <!-- Eyebrow -->
            <span class="owner-cta__eyebrow">
                FOR PG OWNERS
            </span>
            <!-- Title -->
            <h2 class="owner-cta__title">
                Run a PG?
                <span>Fill your beds faster.</span>
            </h2>
            <!-- Description -->
            <p class="owner-cta__description">
                List your PG, keep availability updated,
                and manage bookings from one simple dashboard.
            </p>
            <!-- Benefits -->
            <div class="owner-cta__benefits">
                <div class="owner-cta__benefit">
                    <span class="owner-cta__benefit-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m5 12 4 4L19 6" />
                        </svg>
                    </span>
                    <span>
                        Free listing
                    </span>
                </div>
                <div class="owner-cta__benefit">
                    <span class="owner-cta__benefit-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m5 12 4 4L19 6" />
                        </svg>
                    </span>
                    <span>
                        Manage availability
                    </span>
                </div>
                <div class="owner-cta__benefit">
                    <span class="owner-cta__benefit-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m5 12 4 4L19 6" />
                        </svg>
                    </span>
                    <span>
                        Manage bookings
                    </span>
                </div>
            </div>
            <!-- CTA -->
            <button type="button" class="owner-cta__button" (click)="listYourPG()">
                <span>
                    List your PG
                </span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h14" />
                    <path d="m13 6 6 6-6 6" />
                </svg>
            </button>
        </div>
        <!-- ============================================
             VISUAL
        ============================================= -->
        <div class="owner-cta__visual">
            <div class="owner-cta__image-wrapper">
                <img src="assets/images/owner-pg.jpg" alt="PG owner accommodation" loading="lazy" />
            </div>
            <!-- Floating Card -->
            <div class="owner-cta__floating-card">
                <span class="owner-cta__floating-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m5 12 4 4L19 6" />
                    </svg>
                </span>
                <div>
                    <strong>
                        Grow your PG
                    </strong>
                    <small>
                        Reach more tenants
                    </small>
                </div>
            </div>
        </div>
    </div>
</section>
