<section class="how-it-works">
    <div class="how-it-works__container">
        <!-- ============================================
             SECTION HEADER
        ============================================= -->
        <div class="how-it-works__header">
            <span class="how-it-works__eyebrow">
                SIMPLE & EASY
            </span>
            <h2 class="how-it-works__title">
                How it works
            </h2>
            <p class="how-it-works__subtitle">
                From finding your PG to moving in,
                everything is simple and transparent.
            </p>
        </div>
        <!-- ============================================
             STEPS
        ============================================= -->
        <div class="how-it-works__steps">
            <ng-container *ngFor="let step of steps; let last = last">
                <!-- STEP -->
                <article class="how-it-works__step">
                    <!-- Number + Icon -->
                    <div class="how-it-works__icon-wrapper">
                        <div class="how-it-works__icon">
                            <!-- SEARCH -->
                            <svg *ngIf="step.icon === 'search'" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="11" cy="11" r="6.5" />
                                <path d="m16 16 5 5" />
                            </svg>
                            <!-- BOOK -->
                            <svg *ngIf="step.icon === 'book'" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v17H7.5A2.5 2.5 0 0 0 5 22V5.5Z" />
                                <path d="M5 5.5V19" />
                                <path d="M9 7h6" />
                                <path d="M9 11h6" />
                            </svg>
                            <!-- HOME -->
                            <svg *ngIf="step.icon === 'home'" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 11.5 12 4l9 7.5" />
                                <path d="M5 10.5V21h14V10.5" />
                                <path d="M9 21v-6h6v6" />
                            </svg>
                        </div>
                        <span class="how-it-works__number">
                            {{ step.number }}
                        </span>
                    </div>
                    <!-- Content -->
                    <div class="how-it-works__content">
                        <h3 class="how-it-works__step-title">
                            {{ step.title }}
                        </h3>
                        <p class="how-it-works__step-description">
                            {{ step.description }}
                        </p>
                    </div>
                </article>
                <!-- Connector -->
                <div class="how-it-works__connector" *ngIf="!last" aria-hidden="true">
                    <svg viewBox="0 0 80 24">
                        <path d="M2 12h68" />
                        <path d="m62 6 8 6-8 6" />
                    </svg>
                </div>
            </ng-container>
        </div>
        <!-- ============================================
             BOTTOM TRUST MESSAGE
        ============================================= -->
        <div class="how-it-works__trust">
            <span class="how-it-works__trust-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3 5 6v5c0 4.5 2.8 8.2 7 10 4.2-1.8 7-5.5 7-10V6l-7-3Z" />
                    <path d="m8.5 12 2.3 2.3 4.7-5" />
                </svg>
            </span>
            <span>
                Simple, transparent and verified PG listings
            </span>
        </div>
    </div>
</section>
